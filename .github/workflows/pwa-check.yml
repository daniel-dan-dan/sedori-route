name: PWA checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api.js
      - run: node --check amazon-pricing.js
      - run: node --check app.js
      - run: node --check storage.js
      - run: node --check quiz.js
      - run: node --check pair.js
      - run: node --check bootstrap.js
      - run: node --check sw.js
      # Backend integration tests run privately with the adjacent GAS checkout.
      # Do not publish private GAS code just to satisfy the public PWA CI.
      - run: node --test route-app.test.mjs route-amazon-pricing.test.mjs route-operation-reservation.test.mjs route-safety-remediation.test.mjs route-ui.test.mjs
      - run: node verify-pwa-version.mjs
